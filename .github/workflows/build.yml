name: Build

on:
  push:
    branches: ["*"]
    tags: ["v*"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Download AE2 dependency
        run: |
          mkdir -p libs/maven/appeng/appliedenergistics2/15.4.10/
          curl -sL "https://edge.forgecdn.net/files/7148/487/appliedenergistics2-forge-15.4.10.jar" \
            -o libs/maven/appeng/appliedenergistics2/15.4.10/appliedenergistics2-15.4.10.jar
          cat > libs/maven/appeng/appliedenergistics2/15.4.10/appliedenergistics2-15.4.10.pom << 'POM'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd" xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
            <modelVersion>4.0.0</modelVersion>
            <groupId>appeng</groupId>
            <artifactId>appliedenergistics2</artifactId>
            <version>15.4.10</version>
            <packaging>jar</packaging>
          </project>
          POM

      - name: Build
        run: ./gradlew build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emilink
          path: build/libs/emilink-*.jar

  release:
    if: startsWith(github.ref_name, 'v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Download AE2 dependency
        run: |
          mkdir -p libs/maven/appeng/appliedenergistics2/15.4.10/
          curl -sL "https://edge.forgecdn.net/files/7148/487/appliedenergistics2-forge-15.4.10.jar" \
            -o libs/maven/appeng/appliedenergistics2/15.4.10/appliedenergistics2-15.4.10.jar
          cat > libs/maven/appeng/appliedenergistics2/15.4.10/appliedenergistics2-15.4.10.pom << 'POM'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd" xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
            <modelVersion>4.0.0</modelVersion>
            <groupId>appeng</groupId>
            <artifactId>appliedenergistics2</artifactId>
            <version>15.4.10</version>
            <packaging>jar</packaging>
          </project>
          POM

      - name: Build Release
        run: ./gradlew build -Pmod_version=${GITHUB_REF_NAME#v}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: EmiLink ${{ github.ref_name }}
          body: |
            See [CHANGELOG](CHANGELOG.md) for details.
          files: build/libs/emilink-*.jar
          generate_release_notes: true
