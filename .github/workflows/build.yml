name: Build

on:
  push:
    branches: ["*"]
    tags: ["v*"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Download dependencies
        run: |
          mkdir -p libs
          curl -L -s -o libs/emi-forge-1.1.22.jar "https://cdn.modrinth.com/data/8fKxQ0Lw/versions/1.1.22%2B1.20.1/emi-forge-1.1.22%2B1.20.1.jar"
          curl -L -s -o libs/appliedenergistics2-15.2.15.jar "https://cdn.modrinth.com/data/X7A999GE/versions/15.2.15/appliedenergistics2-15.2.15.jar"
          curl -L -s -o libs/appliedenergistics2-15.2.15-api.jar "https://cdn.modrinth.com/data/X7A999GE/versions/15.2.15/appliedenergistics2-15.2.15-api.jar"
          ls -la libs/

      - name: Build
        run: ./gradlew build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emilink
          path: build/libs/emilink-*.jar

  release:
    if: startsWith(github.ref_name, 'v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Download dependencies
        run: |
          mkdir -p libs
          curl -L -s -o libs/emi-forge-1.1.22.jar "https://cdn.modrinth.com/data/8fKxQ0Lw/versions/1.1.22%2B1.20.1/emi-forge-1.1.22%2B1.20.1.jar"
          curl -L -s -o libs/appliedenergistics2-15.2.15.jar "https://cdn.modrinth.com/data/X7A999GE/versions/15.2.15/appliedenergistics2-15.2.15.jar"
          curl -L -s -o libs/appliedenergistics2-15.2.15-api.jar "https://cdn.modrinth.com/data/X7A999GE/versions/15.2.15/appliedenergistics2-15.2.15-api.jar"
          ls -la libs/

      - name: Build Release
        run: ./gradlew build -Pmod_version=${GITHUB_REF_NAME#v}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: EmiLink ${{ github.ref_name }}
          body: |
            See [CHANGELOG](CHANGELOG.md) for details.
          files: build/libs/emilink-*.jar
          generate_release_notes: true
