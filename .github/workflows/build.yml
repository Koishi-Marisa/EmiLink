name: Build

on:
  push:
    branches: ["*"]
    tags: ["v*"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Download dependencies
        run: |
          set -e

          # --- AE2 for Forge 1.20.1 ---
          AE2_DIR="libs/maven/appeng/appliedenergistics2/15.4.10"
          AE2_JAR="$AE2_DIR/appliedenergistics2-15.4.10.jar"
          mkdir -p "$AE2_DIR"

          # Try multiple sources for AE2
          AE2_URLS=(
            "https://github.com/AppliedEnergistics/Applied-Energistics-2/releases/download/forge%2Fv15.4.10/appliedenergistics2-forge-15.4.10.jar"
            "https://edge.forgecdn.net/files/7148/487/appliedenergistics2-forge-15.4.10.jar"
            "https://mediafilez.forgecdn.net/files/7148/487/appliedenergistics2-forge-15.4.10.jar"
          )

          for url in "${AE2_URLS[@]}"; do
            echo "Trying AE2 from: $url"
            if wget --tries=10 --waitretry=5 --timeout=120 --dns-timeout=30 --connect-timeout=30 --read-timeout=120 -q -O "$EMI_JAR" "$url"; then
              if [ -s "$AE2_JAR" ] && [ "$(stat -c%s "$AE2_JAR")" -gt 1000000 ]; then
                echo "AE2 download succeeded ($(stat -c%s "$AE2_JAR") bytes)"
                break
              fi
            fi
            echo "AE2 download failed from this source, trying next..."
            rm -f "$AE2_JAR"
          done

          if [ ! -s "$AE2_JAR" ] || [ "$(stat -c%s "$AE2_JAR")" -lt 1000000 ]; then
            echo "ERROR: Failed to download AE2 from all sources"
            exit 1
          fi

          cat > "$AE2_DIR/appliedenergistics2-15.4.10.pom" << 'POM'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd" xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
            <modelVersion>4.0.0</modelVersion>
            <groupId>appeng</groupId>
            <artifactId>appliedenergistics2</artifactId>
            <version>15.4.10</version>
            <packaging>jar</packaging>
          </project>
          POM

          # --- EMI for Forge 1.20.1 ---
          EMI_DIR="libs/maven/dev/emi/emi-forge/1.1.22+1.20.1"
          EMI_JAR="$EMI_DIR/emi-forge-1.1.22+1.20.1.jar"
          mkdir -p "$EMI_DIR"

          # Try multiple sources for EMI
          EMI_URLS=(
            "https://github.com/emilyploszaj/emi/releases/download/1.1.22%2B1.20.1/emi-1.1.22+1.20.1+forge.jar"
            "https://maven.terraformersmc.com/releases/dev/emi/emi-forge/1.1.22+1.20.1/emi-forge-1.1.22+1.20.1.jar"
            "https://cdn.modrinth.com/maven/dev/emi/emi-forge/1.1.22+1.20.1/emi-forge-1.1.22+1.20.1.jar"
            "https://edge.forgecdn.net/files/5370/202/emi-forge-1.1.22+1.20.1.jar"
          )

          for url in "${EMI_URLS[@]}"; do
            echo "Trying EMI from: $url"
            if wget --tries=5 --waitretry=5 --timeout=120 --dns-timeout=30 --connect-timeout=30 --read-timeout=120 -q -O "$EMI_JAR" "$url"; then
              if [ -s "$EMI_JAR" ] && [ "$(stat -c%s "$EMI_JAR")" -gt 500000 ]; then
                echo "EMI download succeeded ($(stat -c%s "$EMI_JAR") bytes)"
                break
              else
                echo "EMI file too small ($(stat -c%s "$EMI_JAR" 2>/dev/null || echo 0) bytes), trying next..."
              fi
            else
              echo "EMI wget failed (exit code $?), trying next..."
            fi
            rm -f "$EMI_JAR"
          done

          if [ ! -s "$EMI_JAR" ] || [ "$(stat -c%s "$EMI_JAR")" -lt 500000 ]; then
            echo "ERROR: Failed to download EMI from all sources"
            exit 1
          fi

          cat > "$EMI_DIR/emi-forge-1.1.22+1.20.1.pom" << 'POM'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd" xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
            <modelVersion>4.0.0</modelVersion>
            <groupId>dev.emi</groupId>
            <artifactId>emi-forge</artifactId>
            <version>1.1.22+1.20.1</version>
            <packaging>jar</packaging>
          </project>
          POM

          echo "All dependencies downloaded successfully"

      - name: Build
        run: ./gradlew build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emilink
          path: build/libs/emilink-*.jar

  release:
    if: startsWith(github.ref_name, 'v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Download dependencies
        run: |
          set -e

          # --- AE2 for Forge 1.20.1 ---
          AE2_DIR="libs/maven/appeng/appliedenergistics2/15.4.10"
          AE2_JAR="$AE2_DIR/appliedenergistics2-15.4.10.jar"
          mkdir -p "$AE2_DIR"

          AE2_URLS=(
            "https://github.com/AppliedEnergistics/Applied-Energistics-2/releases/download/forge%2Fv15.4.10/appliedenergistics2-forge-15.4.10.jar"
            "https://edge.forgecdn.net/files/7148/487/appliedenergistics2-forge-15.4.10.jar"
            "https://mediafilez.forgecdn.net/files/7148/487/appliedenergistics2-forge-15.4.10.jar"
          )

          for url in "${AE2_URLS[@]}"; do
            echo "Trying AE2 from: $url"
            if wget --tries=10 --waitretry=5 --timeout=120 --dns-timeout=30 --connect-timeout=30 --read-timeout=120 -q -O "$EMI_JAR" "$url"; then
              if [ -s "$AE2_JAR" ] && [ "$(stat -c%s "$AE2_JAR")" -gt 1000000 ]; then
                echo "AE2 download succeeded ($(stat -c%s "$AE2_JAR") bytes)"
                break
              fi
            fi
            echo "AE2 download failed from this source, trying next..."
            rm -f "$AE2_JAR"
          done

          if [ ! -s "$AE2_JAR" ] || [ "$(stat -c%s "$AE2_JAR")" -lt 1000000 ]; then
            echo "ERROR: Failed to download AE2 from all sources"
            exit 1
          fi

          cat > "$AE2_DIR/appliedenergistics2-15.4.10.pom" << 'POM'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd" xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
            <modelVersion>4.0.0</modelVersion>
            <groupId>appeng</groupId>
            <artifactId>appliedenergistics2</artifactId>
            <version>15.4.10</version>
            <packaging>jar</packaging>
          </project>
          POM

          # --- EMI for Forge 1.20.1 ---
          EMI_DIR="libs/maven/dev/emi/emi-forge/1.1.22+1.20.1"
          EMI_JAR="$EMI_DIR/emi-forge-1.1.22+1.20.1.jar"
          mkdir -p "$EMI_DIR"

          EMI_URLS=(
            "https://github.com/emilyploszaj/emi/releases/download/1.1.22%2B1.20.1/emi-1.1.22+1.20.1+forge.jar"
            "https://maven.terraformersmc.com/releases/dev/emi/emi-forge/1.1.22+1.20.1/emi-forge-1.1.22+1.20.1.jar"
            "https://cdn.modrinth.com/maven/dev/emi/emi-forge/1.1.22+1.20.1/emi-forge-1.1.22+1.20.1.jar"
            "https://edge.forgecdn.net/files/5370/202/emi-forge-1.1.22+1.20.1.jar"
          )

          for url in "${EMI_URLS[@]}"; do
            echo "Trying EMI from: $url"
            if wget --tries=5 --waitretry=5 --timeout=120 --dns-timeout=30 --connect-timeout=30 --read-timeout=120 -q -O "$EMI_JAR" "$url"; then
              if [ -s "$EMI_JAR" ] && [ "$(stat -c%s "$EMI_JAR")" -gt 500000 ]; then
                echo "EMI download succeeded ($(stat -c%s "$EMI_JAR") bytes)"
                break
              else
                echo "EMI file too small ($(stat -c%s "$EMI_JAR" 2>/dev/null || echo 0) bytes), trying next..."
              fi
            else
              echo "EMI wget failed (exit code $?), trying next..."
            fi
            rm -f "$EMI_JAR"
          done

          if [ ! -s "$EMI_JAR" ] || [ "$(stat -c%s "$EMI_JAR")" -lt 500000 ]; then
            echo "ERROR: Failed to download EMI from all sources"
            exit 1
          fi

          cat > "$EMI_DIR/emi-forge-1.1.22+1.20.1.pom" << 'POM'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd" xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
            <modelVersion>4.0.0</modelVersion>
            <groupId>dev.emi</groupId>
            <artifactId>emi-forge</artifactId>
            <version>1.1.22+1.20.1</version>
            <packaging>jar</packaging>
          </project>
          POM

          echo "All dependencies downloaded successfully"

      - name: Build Release
        run: ./gradlew build -Pmod_version=${GITHUB_REF_NAME#v}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: EmiLink ${{ github.ref_name }}
          body: |
            See [CHANGELOG](CHANGELOG.md) for details.
          files: build/libs/emilink-*.jar
          generate_release_notes: true
